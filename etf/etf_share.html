<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="../common/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETF 份额变动看板</title>

<!-- 直接使用 CDN，避免 document.write 引起的阻塞 -->
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>

<!-- 公共框架样式（必须最先） -->
<link rel="stylesheet" href="../common/common.css">
<!-- 本页样式 -->
<link rel="stylesheet" href="etf_share.css">
<!-- 导航：一级 nav-group / 子分组 nav-sub / 菜单项 nav-title / 排序 nav-order（可删任意一行） -->
<meta name="nav-group" content="资金结构">
<meta name="nav-sub" content="份额跟踪">
<meta name="nav-title" content="ETF 份额变动">
<meta name="nav-order" content="1">
</head>
<body class="theme-dark">
  <div class="app-layout">

    <!-- ================= 主内容 ================= -->
    <main class="main-content">
      <div class="wrap">
        <header>
          <div>
            <h1>ETF 场内份额变动看板</h1>
            <p id="subtitle">同类指数合并切换对比 · 数据来源：上交所 / 深交所</p>
          </div>
        </header>

        <div class="toolbar">
          <div class="mode-wrapper">
            <div class="group">
              <button class="mode-btn active" data-mode="abs">绝对份额</button>
              <button class="mode-btn" data-mode="norm">归一化对比</button>
            </div>
            <div class="info-tooltip">
              <span class="icon">!</span>
              <span class="tooltip-text">绝对份额：看真实规模变动<br>归一化对比：看相对涨跌趋势</span>
            </div>
          </div>

          <div class="group">
            <button class="range-btn" data-months="1">1M</button>
            <button class="range-btn" data-months="3">3M</button>
            <button class="range-btn active" data-months="6">6M</button>
            <button class="range-btn" data-months="12">1Y</button>
            <button class="range-btn" data-months="0">全部</button>
          </div>

          <div class="group category-group">
            <button class="category-btn active" data-category="broad">宽基</button>
            <button class="category-btn" data-category="sector">行业</button>
          </div>
        </div>

        <!-- 两个看板的内容由 etf_share_function.js 统一渲染，避免静态占位数据与真实数据打架 -->
        <div class="top-dashboard">
          <div id="announcement-board" class="announcement-board" style="display:none"></div>
          <div id="leaderboard-board" class="leaderboard-board" style="display:none"></div>
        </div>

        <div class="charts-grid" id="charts-grid"></div>

        <footer>数据来源: 上交所 / 深交所 · 份额为场内份额，单位为亿份</footer>
      </div>
    </main>
  </div>

  <div id="tooltip" class="lw-tooltip"></div>

  <!-- 数据 → 本页逻辑 → 公共交互 -->
  <script src="etf_share_data_broad.js"></script>
  <script src="etf_share_data_sector.js"></script>
  <script src="../common/common.js"></script>
  <script src="etf_share_function.js"></script>

</body>
</html>
