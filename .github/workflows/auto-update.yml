name: Auto Update Market Data

on:
  schedule:
    # 每天 UTC 时间 00:00 执行（对应北京时间 08:00，等A股收盘和数据更新后次日获取）
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许你随时手动点按钮跑一次

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests zzshare akshare

    - name: 运行抓取脚本
      run: python stock.py

    - name: 提交并推送更新
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add market_data.js
        # 如果数据有变化则提交，没变化则跳过（比如周末）
        git commit -m "Auto update market_data.js" || echo "No changes to commit"
        git push origin main
