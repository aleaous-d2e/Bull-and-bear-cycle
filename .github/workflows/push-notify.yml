name: Auto Update Market Data and Notify

on:
  push:
    branches: [ main ]     # 当你手动 git push 时触发
  schedule:
    - cron: '06 0 * * *'   # 每天北京时间 08:06 自动触发 (UTC 00:06)
  workflow_dispatch:       # 允许在 GitHub 网页 Actions 面板上手动点击运行

jobs:
  update-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # 允许 Action 自动向仓库提交代码
    concurrency:           # 并发控制，减少偶尔卡死
      group: pages-deploy
      cancel-in-progress: true

    steps:
      # 1. 拉取代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 准备 Python 环境
      - name: Set up Python
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. 运行总控脚本（继续执行后续步骤，允许部分失败）
      - name: Run Python Script
        id: run_scripts
        continue-on-error: true  # 即使某个子任务报错，也允许提交其他成功的代码
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          ZZSHARE_TOKEN: ${{ secrets.ZZSHARE_TOKEN }}
        run: |
          pip install requests pandas zzshare akshare
          python common/run_all.py

      # 4. 检查是否有数据更新
      - name: Check for changes
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: check_changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # 5. 提交并推送更改
      - name: Commit and Push Changes
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Auto update market data [skip ci]"
          git push

      # ================= 发送通知 =================
      - name: Send WeCom Notification
        if: always() && (github.event_name == 'push' || steps.check_changes.outputs.changed == 'true')
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SITE_URL: ${{ secrets.SITE_URL }}
          EVENT_NAME: ${{ github.event_name }}
          IS_SUCCESS: ${{ steps.run_scripts.outcome == 'success' }}
        run: |
          CURRENT_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          TIMESTAMP=$(date +%s)
          DAY=$(TZ='Asia/Shanghai' date '+%d')
          
          # 1. 判断标题（区分 push 和 定时任务，且判断是否失败）
          if [ "$EVENT_NAME" == "push" ]; then
            TITLE="✅ **代码推送成功**"
          elif [ "$IS_SUCCESS" == "true" ]; then
            TITLE="✅ **数据更新提示**"
          else
            TITLE="❌ **部分任务执行失败**"
          fi

          # 2. 拼接消息内容（使用 $'\n' 确保正确换行）
          MSG_CONTENT="$TITLE"$'\n'
          MSG_CONTENT+="> **时间**：${CURRENT_TIME}"$'\n'
          
          # 月初提示 (1号到5号之间)
          if [ "$DAY" -le 5 ]; then
            MSG_CONTENT+="> 📈 **提示**：触发月初综合月度任务"$'\n'
          fi
          
          MSG_CONTENT+=$'\n'"👉 [点击查看最新数据](${SITE_URL}?v=${TIMESTAMP})"
          
          # 如果是定时任务且执行失败，追加日志排查链接
          if [ "$EVENT_NAME" != "push" ] && [ "$IS_SUCCESS" != "true" ]; then
            MSG_CONTENT+=$'\n\n'"⚠️ [点击查看 Actions 日志排查失败原因](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          fi

          # 3. 推送企业微信
          JSON_PAYLOAD=$(jq -n --arg content "$MSG_CONTENT" '{msgtype: "markdown", markdown: {content: $content}}')
          curl -s -H "Content-Type: application/json" -d "$JSON_PAYLOAD" "$WECOM_WEBHOOK"