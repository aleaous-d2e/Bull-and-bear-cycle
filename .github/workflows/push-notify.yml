name: Push Notification to WeCom

on:
  push:
    branches: [ main ] # 确认这是你的分支

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send WeCom Notification
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SITE_URL: ${{ secrets.SITE_URL }}
          SHA: ${{ github.sha }}
        run: |
          # 1. 构造极简 JSON
          JSON_PAYLOAD=$(jq -n \
            --arg url "${SITE_URL}?v=${SHA}" \
            '{
              msgtype: "markdown",
              markdown: {
                content: "✅ **代码推送成功，数据已更新**\n\n👉 [点击查看最新数据](\($url))"
              }
            }')
          
          # 2. 打印要推送的内容，方便在日志里核对
          echo "正在发送的内容: $JSON_PAYLOAD"
          echo "当前使用的 Webhook 地址是: $WECOM_WEBHOOK"
          
          # 3. 发送请求
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Content-Type: application/json" -d "$JSON_PAYLOAD" "$WECOM_WEBHOOK")
          
          echo "企业微信 API 返回状态码: $HTTP_CODE"
          
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "推送失败，请检查 Webhook 地址是否配置正确。"
            exit 1
          fi
          echo "推送成功！"
