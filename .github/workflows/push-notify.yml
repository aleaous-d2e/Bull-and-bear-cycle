name: Push Notification to WeCom

on:
  push:
    branches: [ main ]   # 改成你的主分支名，如 master

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send WeCom Notification
        run: |
          curl -H "Content-Type: application/json" \
          -d "{
            \"msgtype\": \"markdown\",
            \"markdown\": {
              \"content\": \"✅ **代码推送成功，数据已更新**\n> **仓库**: ${{ github.repository }}\n>  **时间**: ${{ github.event.head_commit.timestamp }}\n\n👉 [点击查看最新数据](${{ secrets.SITE_URL }})\"
            }
          }" \
          ${{ secrets.WECOM_WEBHOOK }}
