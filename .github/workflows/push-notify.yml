name: Push Notification to WeCom

on:
  push:
    branches: [ main ] # 你可以改为你的主分支名称，如 master

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send WeCom Notification
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "msgtype": "markdown",
            "markdown": {
              "content": "✅ **代码推送成功**\n> **仓库**: ${{ github.repository }}\n> **分支**: ${{ github.ref_name }}\n> **提交者**: ${{ github.actor }}\n>  **时间**: ${{ github.event.head_commit.timestamp }}"
            }
          }' \
          ${{ secrets.WECOM_WEBHOOK }}
