name: Cleanup Old Logs

on:
  schedule:
    - cron: '0 3 * * 1' # 每周一 UTC 03:00（北京时间 11:00），允许延迟，无影响
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write # 必须有删除权限
      contents: read # 读取仓库内容权限

    steps:
      - name: Delete 7 days old runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 获取 7 天前的 ISO 8601 标准时间（例如：2023-10-20T00:00:00Z）
          CUTOFF_TIME=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "开始清理早于 $CUTOFF_TIME 的记录..."

          # 1. 直接拉取最近 500 条 workflow run 的信息
          # 记录包含：运行ID、工作流名称、创建时间
          echo "正在获取最近的工作流记录..."
          RUNS_JSON=$(gh run list --limit 100 --json databaseId,workflowName,createdAt)
          
          # 2. 使用 jq 在本地进行筛选
          # 条件 a: createdAt 必须小于 CUTOFF_TIME
          # 条件 b: workflowName 必须匹配我们指定的三个工作流（使用正则，确保名称完全一致）
          RUN_IDS=$(echo "$RUNS_JSON" | jq -r --arg CUTOFF "$CUTOFF_TIME" '
            .[] | 
            select(.createdAt < $CUTOFF) | 
            select(.workflowName | test("Auto Update Market Data and Notify|pages build and deployment|Cleanup Old Logs")) | 
            .databaseId
          ')

          # 3. 判断是否有需要删除的记录
          if [ -z "$RUN_IDS" ]; then
            echo "没有找到符合条件（7天前）的旧记录，退出清理。"
            exit 0
          fi

          echo "找到以下待删除的运行 ID："
          echo "$RUN_IDS"

          # 4. 循环删除
          for RUN_ID in $RUN_IDS; do
            echo "正在删除 Run ID: $RUN_ID"
            # 使用 gh api 直接发起 DELETE 请求，如果失败会打印 HTTP 状态码
            gh api -X DELETE "repos/$GH_REPO/actions/runs/$RUN_ID" --silent || echo "❌ 删除失败: $RUN_ID"
          done
          
          echo "✅ 所有清理任务完成！"
