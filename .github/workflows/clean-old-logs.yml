name: Cleanup Old Logs

on:
  workflow_dispatch: # 为了方便测试，先改成手动触发

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Debug and Delete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          CUTOFF_TIME=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "🕒 当前截止时间: $CUTOFF_TIME"
          
          # 1. 拉取最近 1000 条记录（增大拉取量，确保旧记录被包含）
          echo "📥 正在获取最近 1000 条记录..."
          RUNS_JSON=$(gh run list --limit 1000 --json databaseId,workflowName,createdAt,status)
          
          # --- 诊断点 1：打印获取到的前几个 JSON 条目，看看长什么样 ---
          echo "🔍 获取到的 JSON 前 5 条数据预览："
          echo "$RUNS_JSON" | jq '.[0:5]'

          # 2. 提取需要删除的 ID
          RUN_IDS=$(echo "$RUNS_JSON" | jq -r --arg CUTOFF "$CUTOFF_TIME" '
            .[] | 
            select(.createdAt < $CUTOFF) | 
            select(.workflowName | test("Auto Update Market Data and Notify|pages build and deployment|Cleanup Old Logs")) | 
            .databaseId
          ')

          # --- 诊断点 2：查看筛选出的 ID 列表 ---
          echo "🎯 筛选出的待删除 ID 列表："
          if [ -z "$RUN_IDS" ]; then
            echo "❌ 警告：没有匹配到任何需要删除的 ID！"
          else
            echo "$RUN_IDS"
          fi

          # 3. 执行删除（去掉静默，强制打印错误码）
          for RUN_ID in $RUN_IDS; do
            echo "--------------------------------------------------"
            echo "正在尝试删除 Run ID: $RUN_ID"
            # 使用 gh api 删除，打印完整的 HTTP 响应（如果出错，这里会显示）
            if gh api -X DELETE "repos/$GH_REPO/actions/runs/$RUN_ID" --verbose; then
              echo "✅ 成功删除 $RUN_ID"
            else
              echo "❌ 删除失败 $RUN_ID，请查看上方输出中的 HTTP 错误信息。"
            fi
          done
          
          echo "✅ 任务结束"
