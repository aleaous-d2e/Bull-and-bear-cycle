name: Cleanup Old Logs

on:
  schedule:
    - cron: '0 3 * * 1' # 每周一 UTC 03:00（北京时间 11:00），允许延迟，无影响
  workflow_dispatch: # 允许手动触发执行

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write # 必须有删除工作流运行的权限
      contents: read # 推荐的只读权限，最小化原则

    steps:
      - name: Delete 7 days old runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 获取 7 天前的 ISO 8601 标准时间（例如：2026-11-08T02:00:21Z）
          CUTOFF_TIME=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "开始清理早于 $CUTOFF_TIME 的记录..."
          
          # 使用 GitHub API 直接查询并进行时间过滤
          # 注意：使用 %3C 代替 <（防止被 Shell 误解析），--paginate 确保突破 1000 条限制拉取全部旧记录
          # 使用 jq 精确筛选需要清理的工作流名称（注意 pages 工作流 API 返回的是带横杠的名称）
          echo "正在获取并筛选旧记录..."
          RUN_IDS=$(gh api "repos/$GH_REPO/actions/runs?created=%3C${CUTOFF_TIME}" --paginate --jq '
            .workflow_runs[] | 
            select(
              .name == "Auto Update Market Data and Notify" or 
              .name == "pages-build-deployment" or 
              .name == "Cleanup Old Logs"
            ) | 
            .id
          ')

          # 如果没有匹配到任何数据，结束任务
          if [ -z "$RUN_IDS" ]; then
            echo "没有找到符合条件（7天前）的旧记录，退出清理。"
            exit 0
          fi

          # 开始循环执行删除
          echo "找到待删除的运行记录，开始执行清理..."
          for RUN_ID in $RUN_IDS; do
            echo "正在删除 Run ID: $RUN_ID"
            # 调用 API 删除，如果失败会在日志中打印报错信息
            if gh api -X DELETE "repos/$GH_REPO/actions/runs/$RUN_ID"; then
              echo "✅ 成功删除 $RUN_ID"
            else
              echo "❌ 删除失败 $RUN_ID"
            fi
          done
          
          echo "🎉 所有清理任务完成！"
