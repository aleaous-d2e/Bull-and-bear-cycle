name: Cleanup Old Logs

on:
  workflow_dispatch: # 为了方便测试，暂时设为手动触发

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Delete 7 days old runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 获取 7 天前的 ISO 8601 标准时间（例如：2026-11-08T02:00:21Z）
          CUTOFF_TIME=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "🕒 开始清理早于 $CUTOFF_TIME 的记录..."

          # 使用 API 直接过滤时间，并让 --paginate 自动翻页获取所有旧记录
          # 注意这里用 name 字段，且精确匹配横杠名称 pages-build-deployment
          echo "🔍 正在查询旧记录..."
          RUN_IDS=$(gh api "repos/$GH_REPO/actions/runs?created=<${CUTOFF_TIME}" --paginate --jq '
            .workflow_runs[] | 
            select(
              .name == "Auto Update Market Data and Notify" or 
              .name == "pages-build-deployment" or 
              .name == "Cleanup Old Logs"
            ) | 
            .id
          ')

          # 判断是否真的查到了数据
          if [ -z "$RUN_IDS" ]; then
            echo "✅ 没有找到 7 天前的目标工作流记录，无需清理。"
            exit 0
          fi

          echo "🎯 成功找到以下待删除的 Run ID："
          echo "$RUN_IDS"
          echo "--------------------------------------------------"

          # 循环删除
          for RUN_ID in $RUN_IDS; do
            echo "正在删除 Run ID: $RUN_ID"
            # 调用 API 删除，如果失败会直接打印 HTTP 错误
            if gh api -X DELETE "repos/$GH_REPO/actions/runs/$RUN_ID"; then
              echo "✅ 成功删除 $RUN_ID"
            else
              echo "❌ 删除失败 $RUN_ID (请查看上方 HTTP 错误代码)"
            fi
          done
          
          echo "=================================================="
          echo "🎉 所有清理任务完成！"
