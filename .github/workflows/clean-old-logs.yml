name: Cleanup Old Logs

on:
  workflow_dispatch: # 为了方便测试，暂时设为手动触发

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Delete 7 days old runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          CUTOFF_TIME=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "🕒 开始清理早于 $CUTOFF_TIME 的记录..."

          # 注意：这里使用 %3C 代替 <，防止被 Shell 或 HTTP 解析器忽略
          echo "🔍 正在查询旧记录..."

          # 1. 先探测服务端到底有多少条旧记录
          COUNT=$(gh api "repos/$GH_REPO/actions/runs?created=%3C${CUTOFF_TIME}" --jq '.total_count')
          echo "📊 服务端返回：总共有 $COUNT 条早于该时间的工作流记录。"

          if [ "$COUNT" -eq 0 ]; then
            echo "✅ API 确认没有旧记录，结束。"
            exit 0
          fi

          # 2. 筛选目标 ID（加入 test("pages|Auto Update|Cleanup"; "i") 作为正则兜底，防止名称里横杠空格不一致）
          echo "🎯 正在筛选需要清理的工作流 ID..."
          RUN_IDS=$(gh api "repos/$GH_REPO/actions/runs?created=%3C${CUTOFF_TIME}" --paginate --jq '
            .workflow_runs[] | 
            select(
              .name == "Auto Update Market Data and Notify" or 
              .name == "pages-build-deployment" or 
              .name == "pages build and deployment" or
              .name == "Cleanup Old Logs" or
              (.name | test("pages|Auto Update|Cleanup"; "i"))
            ) | 
            .id
          ')

          if [ -z "$RUN_IDS" ]; then
            echo "⚠️ 虽然有旧记录，但没有找到属于目标工作流的记录。"
            exit 0
          fi

          echo "🎯 开始执行删除..."
          # 3. 循环删除
          for RUN_ID in $RUN_IDS; do
            echo "正在删除 Run ID: $RUN_ID"
            # 如果失败，打印出真实报错
            gh api -X DELETE "repos/$GH_REPO/actions/runs/$RUN_ID" || echo "❌ 删除失败: $RUN_ID"
          done
          
          echo "🎉 清理任务完成！"
