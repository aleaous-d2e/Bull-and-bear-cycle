<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="./common/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据中心</title>
<script>(function(){var t='dark';try{var s=localStorage.getItem('site-theme');t=(s==='light'||s==='dark')?s:((new Date().getHours()>=9&&new Date().getHours()<19)?'light':'dark')}catch(e){}document.documentElement.classList.add('theme-'+t);document.documentElement.style.colorScheme=t==='light'?'light':'dark'})();</script>
<link rel="stylesheet" href="./common/common.css">
<style>
  .home { width: 100%; max-width: 1080px; margin: 0 auto; padding: 8px 0 40px; }
  .home h1 { font-size: 26px; margin: 8px 0 6px; letter-spacing: .5px; }
  .home .lead { color: var(--muted); font-size: 13px; line-height: 1.8; margin-bottom: 26px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .entry { text-decoration: none; display: block; transition: transform .18s ease, border-color .18s ease; }
  .entry:hover { transform: translateY(-2px); border-color: var(--accent); }
  .entry h3 { font-size: 15px; color: var(--text); margin: 0 0 8px; }
  .entry p { font-size: 12.5px; color: var(--muted); line-height: 1.7; margin: 0; }
  .entry .tag { margin-bottom: 10px; }
</style>
</head>
<body>
<div class="app-layout">
  <main class="main-content">
    <div class="home">
      <h1>数据中心</h1>
      <div class="grid">
        <a class="entry chart-card" href="./top_base/top_base.html">
          <span class="tag">顶底研究</span>
          <h3>熊底监测</h3>
          <p>指数通道、破净比例与两融出清信号，多信号交叉校准历史大底位置。</p>
        </a>
        <a class="entry chart-card" href="./market/avg_price.html">
          <span class="tag">市场估值</span>
          <h3>阿巴阿中</h3>
          <p>市值/GDP 与平均股价分位对照，附双轨斜率的 A-B-C 推演。</p>
        </a>
        <a class="entry chart-card" href="./etf/etf_share.html">
          <span class="tag">资金结构</span>
          <h3>ETF 份额变动</h3>
          <p>宽基与行业 ETF 的份额增减，看钱往哪边流。</p>
        </a>
        <a class="entry chart-card" href="./etf/etf_gjd_report.html">
          <span class="tag">资金结构</span>
          <h3>国家队行为框架</h3>
          <p>2008–2026 国家队持仓与市场周期的对应关系。</p>
        </a>
      </div>
    </div>
  </main>
</div>
<script src="./common/common.js"></script>
</body>
</html>
