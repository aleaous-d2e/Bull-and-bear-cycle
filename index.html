<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>牛熊指标</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script src="market_data.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
   html, body {
    overflow-x: hidden;              /* ★ 彻底防止整页横向滚动条 */
    max-width: 100vw;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", sans-serif;
    background: #f0f2f5; color: #1f2937; padding: 12px;
    -webkit-text-size-adjust: 100%;
  }
  /* ★ 整体宽度：由 1440px 改为 1080px */
  .wrap { max-width: 1080px; margin: 0 auto; overflow-x: hidden; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; flex-wrap: wrap; gap: 8px;
  }
  header h1 { font-size: 26px; font-weight: 800; color: #111827; letter-spacing: 1px; }

  .kpi-row {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 10px; margin-bottom: 12px;
  }
  .card {
    background: #fff; border-radius: 10px; padding: 14px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .kpi-label {
    font-size: 12px; color: #6b7280; margin-bottom: 6px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 6px;
  }
  .kpi-date { font-size: 11px; color: #9ca3af; font-weight: 400; }
  .kpi-value { font-size: 22px; font-weight: 700; line-height: 1.2; }
  .kpi-value small { font-size: 12px; font-weight: 500; color: #6b7280; margin-left: 4px; }
  .kpi-delta { font-size: 11px; margin-top: 4px; }

  .kpi-delta.up { color: #ef4444; }
  .kpi-delta.down { color: #10b981; }
  .kpi-delta.flat { color: #6b7280; }

  .chart-card { padding: 8px 8px 0 8px; margin-bottom: 12px; }
  .chart-toolbar {
    display: flex; justify-content: flex-end; align-items: center;
    padding: 4px 4px 0; gap: 8px; flex-wrap: wrap;
  }
  .chart-title {
    margin-right: auto; padding-left: 6px;
    font-size: 13px; font-weight: 600; color: #374151;
    display: flex; align-items: center; gap: 6px;
  }

  .gran-switch {
    display: inline-flex; background: #f3f4f6; border-radius: 8px; padding: 2px;
  }
  .gran-switch button {
    border: none; background: transparent; color: #6b7280;
    font-size: 12px; padding: 5px 14px; border-radius: 6px;
    cursor: pointer; transition: all .15s; font-family: inherit;
    font-weight: 500; line-height: 1;
  }
  .gran-switch button.active { background: #2563eb; color: #fff; }
  .gran-switch button:not(.active):hover { color: #2563eb; }

  /* 三条趋势线按钮（颜色与线条一致） */
  .trend-btn {
    border: 1px solid #e5e7eb; background: #fff; color: #9ca3af;
    font-size: 12px; padding: 5px 12px; border-radius: 6px;
    cursor: pointer; font-family: inherit; font-weight: 500;
    line-height: 1; transition: all .15s;
  }
  .trend-btn:hover { color: #6b7280; border-color: #d1d5db; }
  .trend-btn.active.high { background: #dc2626; color: #fff; border-color: #dc2626; }
  .trend-btn.active.low  { background: #2563eb; color: #fff; border-color: #2563eb; }
  .trend-btn.active.mix  { background: #8b5cf6; color: #fff; border-color: #8b5cf6; }

  .chart { width: 100%; height: 440px; }
  .chart-sm { height: 420px; }

  /* ★ 平均股价月线图：整体宽度固定 1080px，
       卡片左右内边距归零，让图表的实际宽度正好等于 1080px */
  .chart-price-card { padding-left: 0; padding-right: 0; }
  .chart-price-card #chart-price { width: 1080px; max-width: 100%; margin: 0 auto; }
  .chart-price-card .chart-toolbar { padding-left: 8px; padding-right: 8px; }

  .chart-note {
    padding: 12px 14px 16px;
    font-size: 13px;
    font-weight: 700;
    color: #374151;
    line-height: 1.6;
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  .chart-note::before {
    content: '';
    width: 6px; height: 6px;
    margin-top: 7px;
    border-radius: 50%;
    background: #f59e0b;
    flex-shrink: 0;
  }

  .note-bar {
    background: #fff; border-radius: 10px; padding: 12px 16px;
    margin-bottom: 12px; font-size: 12px; color: #6b7280;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
    display: flex; align-items: flex-start; gap: 8px;
  }
  .note-bar::before {
    content: ''; width: 4px; height: 4px; margin-top: 7px;
    border-radius: 50%; background: #2563eb; flex-shrink: 0;
  }

  .table-card { padding: 4px 12px 12px; overflow: hidden; }
  .table-wrap {
    width: 100%;
    /* 去掉 max-width，让表格随屏幕自然铺满 */
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    border-radius: 8px;
  }
  table {
    width: 100%; min-width: 520px;
    border-collapse: collapse; font-size: 13px; white-space: nowrap;
    table-layout: auto; /* 让表格列宽自然分布 */
  }
  /* 所有表头和内容完全居中对齐，并调整水平内边距 */
  th, td {
    padding: 16px 12px;
    text-align: center;
    border-bottom: 1px solid #f3f4f6;
  }
  th {
    background: #f9fafb; color: #6b7280; font-weight: 500;
    font-size: 12px; text-transform: uppercase;
  }
  /* 清除之前的首尾特殊对齐，让所有列保持高度一致的居中 */
  th:first-child, td:first-child { text-align: center; padding-left: 12px; }
  th:last-child, td:last-child { text-align: center; padding-right: 12px; }
  th {
    background: #f9fafb; color: #6b7280; font-weight: 500;
    font-size: 11px; text-transform: uppercase;
  }
  tbody tr:hover { background: #f9fafb; }
  td.num { font-variant-numeric: tabular-nums; }

  td.up { color: #ef4444; }
  td.down { color: #10b981; }

  .tag {
    display: inline-block; padding: 3px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 600; color: #fff;
    white-space: nowrap; letter-spacing: .3px;
  }
  .lv-deep-green { background: #166534; }
  .lv-green      { background: #22c55e; }
  .lv-light-blue { background: #3b82f6; }
  .lv-yellow     { background: #eab308; }
  .lv-orange     { background: #f97316; }
  .lv-red        { background: #dc2626; }

  .err {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; gap: 10px; color: #6b7280; font-size: 13px; line-height: 1.8;
    text-align: center; padding: 20px;
  }
  .err code {
    background: #f3f4f6; padding: 2px 6px; border-radius: 6px;
    font-family: ui-monospace, Menlo, Consolas, monospace; color: #2563eb;
  }

  footer {
    text-align: center; color: #9ca3af; font-size: 11px;
    margin-top: 20px; padding: 10px;
  }

  @media (max-width: 720px) {
    body { padding: 8px; }
      /* ★ 隐藏 H5 端标题 */
    header { display: flex; justify-content: center; margin-bottom: 8px; }
    header h1 { display: none; }
    /* ★ 恢复 H5 端表格紧凑布局 */
    .table-card { padding: 2px 6px 6px; display: block; }
    .table-wrap { max-width: 100%; border-radius: 6px; }
    table { font-size: 10px; min-width: 0; width: 100%; }
    th, td { padding: 6px 3px; }
    th { font-size: 9px; padding: 6px 3px; }
    th:first-child, td:first-child { padding-left: 8px; }
    th:last-child, td:last-child { padding-right: 8px; }

    .kpi-row { grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 8px; }
    .card { padding: 8px 6px; border-radius: 8px; }
    .kpi-label { font-size: 10px; margin-bottom: 2px; gap: 2px; }
    .kpi-date { display: none; }
    .kpi-value { font-size: 16px; }
    .kpi-value small { font-size: 10px; margin-left: 1px; }
    .kpi-delta { font-size: 10px; margin-top: 2px; }

    .chart { height: 280px; }
    .chart-sm { height: 320px; }
    .chart-card { padding: 6px 6px 0; }
    .chart-toolbar { padding: 2px 2px 0; gap: 4px; }
    .chart-title { font-size: 12px; padding-left: 4px; width: 100%; }
    .gran-switch button { font-size: 11px; padding: 4px 10px; }
    .trend-btn { font-size: 10px; padding: 4px 8px; }

    .chart-note { font-size: 10px; padding: 6px 10px 8px; }

    .note-bar { padding: 10px 12px; font-size: 11px; margin-bottom: 8px; }
    .bse-note { display: none; }

     .table-card { padding: 2px 6px 6px; }
    .table-wrap { border-radius: 6px; }
    table { font-size: 10px; min-width: 0; width: 100%; }
    th, td { padding: 6px 3px; }
    th { font-size: 9px; letter-spacing: 0; padding: 6px 3px; }
    /* ★ 关键：给首列“日期”和尾列“操作建议”加上左右安全边距，防止贴边 */
    th:first-child, td:first-child { padding-left: 8px; }
    th:last-child, td:last-child { padding-right: 8px; }

    footer { font-size: 10px; margin-top: 12px; padding: 6px; }
  }

  @media (max-width: 375px) {
    .card { padding: 6px 4px; }
    .kpi-value { font-size: 14px; }
    .kpi-value small { font-size: 9px; }
    .kpi-delta { font-size: 9px; }
    .chart { height: 250px; }
    .chart-sm { height: 280px; }
    .tag { font-size: 9px; padding: 1px 4px; }
    th, td { padding: 4px 2px; }
    table { font-size: 9px; }
    /* ★ 极窄屏幕下的安全边距 */
    th:first-child, td:first-child { padding-left: 6px; }
    th:last-child, td:last-child { padding-right: 6px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>牛熊指标</h1>
  </header>

  <div class="kpi-row">
    <div class="card">
      <div class="kpi-label">
        <span>总市值</span>
        <span class="kpi-date" id="kpi-mv-date">—</span>
      </div>
      <div class="kpi-value" id="kpi-mv">—</div>
      <div class="kpi-delta" id="kpi-mv-d">—</div>
    </div>
    <div class="card">
      <div class="kpi-label" id="kpi-gdp-label">GDP</div>
      <div class="kpi-value" id="kpi-gdp">—</div>
      <div class="kpi-delta flat" id="kpi-gdp-yoy">—</div>
    </div>
    <div class="card">
      <div class="kpi-label">
        <span id="kpi-ratio-label">市值 / GDP</span>
      </div>
      <div class="kpi-value" id="kpi-ratio">—</div>
      <div class="kpi-delta" id="kpi-ratio-d">—</div>
    </div>
  </div>

  <div class="card chart-card">
    <div class="chart-toolbar">
      <div class="gran-switch" id="granSwitch">
        <button data-gran="day" class="active">日</button>
        <button data-gran="week">周</button>
        <button data-gran="month">月</button>
      </div>
    </div>
    <div id="chart-main" class="chart"></div>
  </div>

<div class="note-bar">
  <div style="line-height:1.9;">
    总市值 = 上交所 + 深交所 + 北交所<span class="bse-note">（北交所市值自2021-11-15开市并纳入统计）</span><br>
    <span id="gdp-note">—</span><br>
    T日平均股价计算：所有T日有交易股票收盘价汇总 / 所有T日交易股票数量
  </div>
</div>

  <!-- 平均股价 K 线（月线，含三条可切换趋势线） -->
  <!-- ★ 新增 chart-price-card：让该图整体宽度固定为 1080px -->
  <div class="card chart-card chart-price-card">
    <div class="chart-toolbar">
      <div class="chart-title">平均股价 · 月线</div>
      <button id="trendBtnHigh" class="trend-btn high active">高位风险</button>
      <button id="trendBtnLow"  class="trend-btn low  active">国运支撑</button>
      <button id="trendBtnMix"  class="trend-btn mix  active">低估定投</button>
    </div>
    <div id="chart-price" class="chart chart-sm"></div>
    <div class="chart-note">定投区间可能持续 3 个月 - 24 个月，控制定投策略</div>
  </div>

  <div class="card table-card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>日期</th>
            <th>总市值(万亿)</th>
            <th>总市值 / GDP</th>
            <th>涨跌幅</th>
            <th>估值判断</th>
            <th>操作建议</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <footer>数据来源: 东方财富 · 国家统计局</footer>
</div>

<script>
/* ============================================================
   1. GDP 年度数据（亿元）
   ============================================================ */
const GDP_ANNUAL = {
  2005: 189907.5, 2006: 222578.4, 2007: 274179.7, 2008: 324317.8,
  2009: 354521.6, 2010: 419253.3, 2011: 495707.6, 2012: 547510.6,
  2013: 603660.4, 2014: 655782.9, 2015: 702511.5, 2016: 761193.0,
  2017: 847382.9, 2018: 936010.1, 2019: 1005872.4, 2020: 1034867.6,
  2021: 1173823.0, 2022: 1234029.4, 2023: 1294271.7, 2024: 1348066.2,
  2025: 1401879.2
};

function resolveLatestGDPYear() {
  const currentYear = new Date().getFullYear();
  const lastYear = currentYear - 1;
  if (GDP_ANNUAL[lastYear] != null) return lastYear;
  const years = Object.keys(GDP_ANNUAL).map(Number);
  return Math.max.apply(null, years);
}
const GDP_LATEST_YEAR = resolveLatestGDPYear();
const GDP_FALLBACK = GDP_ANNUAL[GDP_LATEST_YEAR];

/* ============================================================
   1.1 GDP 年度增速 & 当年 GDP 推算（每季度调整一次）
   ============================================================ */
function buildGDPGrowth() {
  const years = Object.keys(GDP_ANNUAL).map(Number).sort((a, b) => a - b);
  const growth = {};
  for (let i = 1; i < years.length; i++) {
    growth[years[i]] = GDP_ANNUAL[years[i]] / GDP_ANNUAL[years[i - 1]] - 1;
  }
  return { years, growth };
}

function estimateCurrentYearGDP() {
  const { years, growth } = buildGDPGrowth();
  const lastYear = years[years.length - 1];
  const currentYear = new Date().getFullYear();

  // 当年 GDP 已有实际值
  if (GDP_ANNUAL[currentYear] != null) {
    return {
      year: currentYear,
      value: GDP_ANNUAL[currentYear],
      growth: growth[currentYear] != null ? growth[currentYear] : null,
      isEstimate: false,
      lastYear: lastYear
    };
  }

  // 用最近 3 年增速均值作为基础增速
  const recentYears = years.slice(-3);
  const recentGrowths = recentYears.map(function (y) { return growth[y]; })
                                   .filter(function (v) { return v != null; });
  const baseGrowth = recentGrowths.length
    ? recentGrowths.reduce(function (a, b) { return a + b; }, 0) / recentGrowths.length
    : 0.05;

  // 按季度进度保守调整（季度越靠后，预判越审慎）
  const month = new Date().getMonth() + 1;
  const quarter = Math.ceil(month / 3);
  const quarterFactor = [1.00, 0.98, 0.96, 0.94][quarter - 1];
  const estGrowth = baseGrowth * quarterFactor;

  // 从 lastYear 逐年推算到 currentYear
  let value = GDP_ANNUAL[lastYear];
  for (let y = lastYear + 1; y <= currentYear; y++) {
    value = value * (1 + estGrowth);
  }

  return {
    year: currentYear,
    value: value,
    growth: estGrowth,
    baseGrowth: baseGrowth,
    quarter: quarter,
    isEstimate: true,
    lastYear: lastYear
  };
}

const GDP_CURRENT = estimateCurrentYearGDP();

// 有效 GDP 表（当年用推算值）
const GDP_EFFECTIVE = Object.assign({}, GDP_ANNUAL);
if (GDP_ANNUAL[GDP_CURRENT.year] == null) {
  GDP_EFFECTIVE[GDP_CURRENT.year] = GDP_CURRENT.value;
}

/* ============================================================
   2. 估值分级
   ============================================================ */
const LEVELS = [
  { min: 1.000,      level: '疯狂',   action: '清仓', cls: 'lv-red' },
  { min: 0.890,      level: '危险',   action: '半仓', cls: 'lv-orange' },
  { min: 0.799,      level: '偏高',   action: '减仓', cls: 'lv-yellow' },
  { min: 0.590,      level: '合理',   action: '持有', cls: 'lv-light-blue' },
  { min: 0.500,      level: '低估',   action: '买入', cls: 'lv-green' },
  { min: -Infinity,  level: '超低估', action: '定投', cls: 'lv-deep-green' }
];
function valuation(r) {
  for (const l of LEVELS) if (r >= l.min) return l;
  return LEVELS[LEVELS.length - 1];
}

/* ============================================================
   3. 数据构建 & 聚合
   ============================================================ */
function ymd(key) {
  return key.slice(0, 4) + '-' + key.slice(4, 6) + '-' + key.slice(6, 8);
}

function num(v, fallback) {
  const n = Number(v);
  return Number.isFinite(n) ? n : fallback;
}

function buildSeries(ashare, bse) {
  const bseMap = {};
  for (const k in bse) bseMap[ymd(k)] = bse[k];

  const out = [];
  for (const date in ashare) {
    const r = ashare[date];
    if (!r || typeof r.ashare_total !== 'number') continue;
    const bseMv = bseMap[date] || 0;
    const mv = r.ashare_total + bseMv;
    const y = +date.slice(0, 4);
    // 使用有效 GDP（含当年推算值）
    const gdp = GDP_EFFECTIVE[y] || GDP_FALLBACK;
    const price = r.price != null ? Number(r.price) : null;

    const o = num(r.open,  price);
    const h = num(r.high,  price);
    const l = num(r.low,   price);
    const c = num(r.close, price);

    out.push({
      date, mv, gdp,
      bse: bseMv,
      sse: r.sse_mv,
      szse: r.szse_mv,
      cnt: r.cnt,
      price: price,
      open: o, high: h, low: l, close: c,
      ratio: mv / gdp
    });
  }
  out.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  return out;
}

function aggregateSeries(daily, gran) {
  if (gran === 'day') return daily;
  const groups = new Map();
  for (const r of daily) {
    let key;
    if (gran === 'month') {
      key = r.date.slice(0, 7);
    } else if (gran === 'week') {
      const d = new Date(r.date + 'T00:00:00');
      const day = d.getDay();
      const diff = day === 0 ? -6 : 1 - day;
      d.setDate(d.getDate() + diff);
      key = d.toISOString().slice(0, 10);
    }
    groups.set(key, r);
  }
  const arr = Array.from(groups.values());
  arr.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  return arr;
}

/* ============================================================
   4. 状态
   ============================================================ */
let chart = null;
let seriesIndex = new Map();
let dailySeries = [];
let weeklySeries = null;
let monthlySeries = null;
let currentGran = 'day';

let priceChart = null;
const currentPriceGran = 'month';   // 仅月线

let showTrendHigh = true;
let showTrendLow  = true;
let showTrendMix  = true;

const priceAggCache = { month: null };

const TREND_NAME = {
  high: '高位风险',
  low:  '国运支撑',
  mix:  '低估定投'
};

function getDisplaySeries() {
  if (currentGran === 'day') return dailySeries;
  if (currentGran === 'week') {
    if (!weeklySeries) weeklySeries = aggregateSeries(dailySeries, 'week');
    return weeklySeries;
  }
  if (currentGran === 'month') {
    if (!monthlySeries) monthlySeries = aggregateSeries(dailySeries, 'month');
    return monthlySeries;
  }
  return dailySeries;
}

/* ============================================================
   5. KPI
   ============================================================ */
function renderKPI() {
  const last = dailySeries[dailySeries.length - 1];
  const prev = dailySeries[dailySeries.length - 2] || last;

  document.getElementById('kpi-mv-date').textContent = 'T-1日：' + last.date;
  document.getElementById('kpi-mv').innerHTML =
    (last.mv / 10000).toFixed(2) + '<small>万亿</small>';

  const chg = (last.mv / prev.mv - 1) * 100;
  const el = document.getElementById('kpi-mv-d');
  el.textContent = '较T-2日 ' + (chg >= 0 ? '+' : '') + chg.toFixed(2) + '%';
  el.className = 'kpi-delta ' + (chg > 0 ? 'up' : chg < 0 ? 'down' : 'flat');

  const yearNow = GDP_LATEST_YEAR;
  const yearBase = yearNow - 1;

  document.getElementById('kpi-gdp-label').textContent = 'GDP（' + yearNow + '）';

  const gdpVal = GDP_ANNUAL[yearNow];
  document.getElementById('kpi-gdp').innerHTML =
    (gdpVal / 10000).toFixed(2) + '<small>万亿</small>';

  const yoyEl = document.getElementById('kpi-gdp-yoy');
  const gdpBase = GDP_ANNUAL[yearBase];
  if (gdpBase) {
    const yoy = (gdpVal / gdpBase - 1) * 100;
    yoyEl.textContent = '同比 ' + yearBase + '年 '
      + (yoy >= 0 ? '+' : '') + yoy.toFixed(2) + '%';

/* ============================================================
   5.1 按月份平移日期（用于计算默认展示区间）
   ============================================================ */
function shiftMonths(dateStr, months) {
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth() - months);
  const lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(day, lastDay));
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + dd;
}

/* ============================================================
   6.1 平均股价 K 线（仅月线）
   ============================================================ */
function weekKeyOf(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  const y  = d.getFullYear();
  const m  = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + dd;
}

function aggregateOHLC(daily, gran) {
  const groups = new Map();

  for (const r of daily) {
    const key = gran === 'month' ? r.date.slice(0, 7) : weekKeyOf(r.date);
    const o = r.open, h = r.high, l = r.low, c = r.close;
    if (o == null || h == null || l == null || c == null) continue;

    const g = groups.get(key);
    if (!g) {
      groups.set(key, {
        key,
        open: o, high: h, low: l, close: c,
        firstDate: r.date, lastDate: r.date
      });
    } else {
      if (h > g.high) g.high = h;
      if (l < g.low)  g.low  = l;
      g.close = c;
      g.lastDate = r.date;
    }
  }

  const arr = Array.from(groups.values());
  arr.sort((a, b) => (a.key < b.key ? -1 : a.key > b.key ? 1 : 0));
  return arr;
}

/* ---------- 趋势线关键锚点（可自由修改） ---------- */
const TREND_HIGH_KEYS = ['2008-02', '2015-12', '2021-12'];
const TREND_LOW_KEYS  = ['2008-11', '2019-01', '2024-02'];
const TREND_MIX_KEYS  = [
  { key: '2005-09', pick: 'high' },
  { key: '2012-12', pick: 'low'  }
];

function linearFit(points) {
  const n = points.length;
  if (n < 2) return null;
  let sx = 0, sy = 0, sxy = 0, sxx = 0;
  for (const p of points) {
    sx += p.x; sy += p.y;
    sxy += p.x * p.y; sxx += p.x * p.x;
  }
  const denom = n * sxx - sx * sx;
  if (Math.abs(denom) < 1e-9) return null;
  const slope = (n * sxy - sx * sy) / denom;
  const intercept = (sy - slope * sx) / n;
  return { slope, intercept };
}

function buildExtendedTrend(agg, anchors) {
  const keyToIdx = new Map();
  agg.forEach((g, i) => keyToIdx.set(g.key, i));

  const pts = [];
  for (const a of anchors) {
    const idx = keyToIdx.get(a.key);
    if (idx != null) pts.push({ x: idx, y: agg[idx][a.pick] });
  }
  if (pts.length < 2) return null;

  const fit = linearFit(pts);
  if (!fit) return null;

  const startIdx = pts[0].x;
  const out = new Array(agg.length).fill(null);
  for (let i = startIdx; i < agg.length; i++) {
    out[i] = +(fit.slope * i + fit.intercept).toFixed(3);
  }
  return out;
}

function buildHighTrend(agg) {
  return buildExtendedTrend(agg, TREND_HIGH_KEYS.map(k => ({ key: k, pick: 'high' })));
}
function buildLowTrend(agg) {
  return buildExtendedTrend(agg, TREND_LOW_KEYS.map(k => ({ key: k, pick: 'low' })));
}
function buildMixTrend(agg) {
  return buildExtendedTrend(agg, TREND_MIX_KEYS);
}

        if (priceChart) priceChart.resize();
      }
    }, 250);
  });
})();
</script>
