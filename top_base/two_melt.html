<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>两融出清信号 · 数据中心</title>
<meta name="nav-title" content="两融出清信号">
<meta name="nav-group" content="顶底部研究">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1220'/%3E%3Cpath d='M6 24 L13 15 L19 19 L26 8' stroke='%2338bdf8' stroke-width='2.4' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../common/common.css">
<script src="https://fastly.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  *{box-sizing:border-box}

  .main-content{padding:22px 18px 28px;background:var(--bg)}
  .stage{width:100%;max-width:1120px;margin:0 auto}

  .brand-title{font-size:18px !important;letter-spacing:.5px}
  .brand-logo{width:26px !important;height:26px !important}
  .brand-logo svg{width:20px !important;height:20px !important}
  .sidebar-header{padding:18px 12px 16px 16px}

  header{display:block;margin-bottom:16px}
  header h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em;color:var(--text)}
  header p{margin:7px 0 0;font-size:13px;color:var(--muted);line-height:1.6}

  .num{font-variant-numeric:tabular-nums}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;
        box-shadow:0 8px 24px rgba(15,23,42,.07),0 2px 6px rgba(15,23,42,.04)}
  body.theme-dark .card{box-shadow:0 12px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.04)}

  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .kpi .k{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;
          align-items:baseline;gap:8px}
  .kpi .k .date{font-size:11px;opacity:.75}
  .kpi .v{font-size:28px;font-weight:700;margin-top:9px;letter-spacing:-.03em;line-height:1.1;color:var(--text)}
  .kpi .v small{font-size:12px;font-weight:400;color:var(--muted);margin-left:4px}
  .kpi .d{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.5}
  .pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:500}



  .block{margin-top:12px}
  .ch-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .ch-head h2{margin:0;font-size:15px;font-weight:600;color:var(--text)}
  .hint{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.6}
  .seg{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:2px}
  .seg button{font:inherit;font-size:12px;padding:5px 12px;border:0;background:transparent;
              color:var(--muted);border-radius:7px;cursor:pointer;transition:.15s}
  .seg button:hover{color:var(--text)}
  .seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
  #chart{width:100%;height:390px;margin-top:4px}

  .note{margin-top:12px;padding:9px 12px;background:var(--accent-soft);
        border-left:3px solid var(--accent);color:var(--muted);border-radius:6px;
        font-size:12px;line-height:1.65}

  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
  thead th{font-weight:500;font-size:12px;color:var(--muted);text-align:left;padding:8px 6px;
           border-bottom:1px solid var(--line)}
  thead th.r,tbody td.r{text-align:right}
  tbody td{padding:8px 6px;border-bottom:1px solid var(--line);color:var(--muted)}
  tbody td:first-child{color:var(--text)}
  tbody tr:last-child td{border-bottom:0}

  footer{text-align:left;color:var(--muted);font-size:12px;line-height:1.9;padding:14px 0 0}

  .empty{padding:40px;text-align:center;border-radius:14px;background:var(--panel);
         border:1px solid var(--line);font-size:13px;color:var(--muted);margin-top:12px}

  @media (max-width:768px){
    .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .kpi .v{font-size:22px}
    header h1{font-size:20px}
    #chart{height:300px}
    .card{padding:14px;border-radius:12px}
    .seg button{padding:5px 9px;font-size:12px}
  }
</style>
<!-- 导航：一级 nav-group / 子分组 nav-sub / 菜单项 nav-title / 排序 nav-order（可删任意一行） -->
<meta name="nav-group" content="顶底部研究">
<meta name="nav-title" content="两融出清信号">
<meta name="nav-order" content="1">
</head>
<body class="theme-light">
<div class="app-layout" id="appLayout">

  <main class="main-content">
    <div class="stage">

      <header>
        <h1>两融出清信号</h1>
        <p id="sub">两融创新低、平均股价不新低 —— 唯一在数据里站得住的规则</p>
      </header>

      <section class="kpis" id="kpis"></section>

      <div class="empty" id="empty" style="display:none">
        没读到 two_melt_data.js 或 market_data.js，请把它们与本页面放在同一目录。
      </div>

      <div id="app" style="display:none">
        <section class="card block">
          <div class="ch-head">
            <div>
              <h2>两融余额 vs 全市场平均股价</h2>
              <div class="hint">红点是历史触发：两融在创 250 日新低，平均股价已不再新低（高出 2% 以上）</div>
            </div>
            <div class="seg" id="range" role="group">
              <button data-y="1" aria-pressed="true">1 年</button>
              <button data-y="3" aria-pressed="false">3 年</button>
              <button data-y="5" aria-pressed="false">5 年</button>
              <button data-y="0" aria-pressed="false">全部</button>
            </div>
          </div>
          <div id="chart"></div>
          <div class="note">这只是杠杆端的出清信号，不等于底部成立——必须与其余指标综合确认。</div>
        </section>

        <section class="card block">
          <div class="ch-head">
            <div>
              <h2>历史触发 <span id="tb-end" style="font-weight:400;color:var(--muted);font-size:12px">—</span></h2>
              <div class="hint">只看触发当天能看到的数据，不含未来收益</div>
            </div>
          </div>
          <table>
            <thead><tr><th>触发日</th><th class="r">两融余额</th><th class="r">平均股价</th>
              <th class="r">股价高出 250 日低点</th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </section>

        <footer>
          口径：两融取「两融余额」（沪深北合计，亿元）；新低为 250 个交易日滚动窗口，触发按 20 个交易日去重。<br>
          <span id="foot-note"></span>
        </footer>
      </div>

    </div>
  </main>
</div>

<script src="../market/market_data.js"></script>
<script src="./two_melt_data.js"></script>
<script src="../common/common.js"></script>
<script>
const fmt=(v,n=2)=>(v===null||v===undefined)?'—':v.toLocaleString('zh-CN',{minimumFractionDigits:n,maximumFractionDigits:n});

let S=null, chart=null, years=1;

function rollingMin(arr,w){
  const out=new Array(arr.length).fill(null);
  for(let i=0;i<arr.length;i++){
    let m=null;
    for(let k=Math.max(0,i-w+1);k<=i;k++){
      const v=arr[k];
      if(v!==null&&v!==undefined&&(m===null||v<m)) m=v;
    }
    out[i]=m;
  }
  return out;
}

function build(){
  const A=MARKET_DATA&&MARKET_DATA.ashare;
  if(!A||!MARGIN_DATA) return false;

  const asc=MARGIN_DATA.rows.slice().reverse()
    .filter(r=>A[r[0]]&&A[r[0]].price)
    .map(r=>[r[0],r[1],A[r[0]].price]);

  const n=asc.length;
  const dates=asc.map(r=>r[0]);
  const bal=asc.map(r=>r[1]);
  const pr=asc.map(r=>r[2]);
  const minB=rollingMin(bal,250);
  const minP=rollingMin(pr,250);

  const raw=[];
  for(let i=260;i<n;i++){
    if(bal[i]===null||pr[i]===null||minB[i]===null||minP[i]===null) continue;
    if(bal[i]<=minB[i]*1.0001 && pr[i]>minP[i]*1.02) raw.push(i);
  }
  const ev=[];
  for(const i of raw){ if(!ev.length||i-ev[ev.length-1]>=20) ev.push(i); }

  const meta=MARGIN_DATA.meta||{}, pm=MARKET_DATA.meta||{};
  S={asc,n,dates,bal,pr,minB,minP,ev,last:n-1,meta,pm,
     dm:meta.end||asc[n-1][0],
     dp:(pm.avg_price_updated_at||'').slice(0,10)||asc[n-1][0]};
  return true;
}

function deviations(){
  const {asc,ev,minP}=S;
  return ev.map(i=>({d:asc[i][0], off:asc[i][2]/minP[i]-1}));
}

function footText(full){
  const arr=deviations();
  const wide=arr.filter(x=>x.off>0.15);
  const near=arr.filter(x=>x.off<=0.15);
  if(!wide.length){
    const mx=Math.max(...arr.map(x=>x.off))*100;
    return `贴低点触发，距低点都在 ${mx.toFixed(1)}% 以内`;
  }
  const m=wide.reduce((a,b)=>a.off>b.off?a:b);
  if(!full) return `${near.length} 次贴低点，${wide.length} 次离低点 15% 以上`;
  return `${m.d} 那次触发时股价已高出低点 ${(m.off*100).toFixed(1)}%，属反弹中途而非底部，是偏离最大的一次。`;
}

function rgba(hex,a){
  const h=hex.replace('#','');
  const n=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

function kpis(){
  const {bal,pr,minB,minP,ev,last}=S;
  const bLow=Math.abs(bal[last]-minB[last])<1e-6;
  const pLow=Math.abs(pr[last]-minP[last])<1e-6;
  const gap=(pr[last]/minP[last]-1)*100;
  const on=bLow&&gap>2;

  const T=getChartTheme();
  const pill=(txt,color)=>txt
    ? `<span class="pill" style="background:${rgba(color,.12)};color:${color}">${txt}</span> `
    : '';

  const row=(k,date,val,u,d,tagColor,tag)=>`<div class="card kpi">
    <div class="k"><span>${k}</span><span class="date">${date||''}</span></div>
    <div class="v num">${val}<small>${u}</small></div>
    <div class="d">${pill(tag,tagColor)}${d}</div></div>`;

  document.getElementById('kpis').innerHTML=[
    row('两融余额', S.dm, fmt(bal[last],0), '亿',
        bLow?`就在 250 日最低 ${fmt(minB[last],0)}`: `距 250 日最低 +${((bal[last]/minB[last]-1)*100).toFixed(1)}%`,
        T.lineRed, bLow&&!pLow?'新低':''),
    row('平均股价', S.dp, fmt(pr[last],2), '元',
        pLow?'也在 250 日最低':`已高出 250 日最低 ${gap.toFixed(1)}%`,
        pLow?T.text:T.lineGreen, pLow?'新低':'未新低'),
    row('出清信号', S.dm, on?'成立':'未成立','',
        bLow?(pLow?'两边同步新低，还没到分叉':'股价已止跌，等两融再破一次低'):'两融未创新低',
        on?T.lineGreen:'', on?'可观察':''),
    row('历史触发','2010-11 起', `${ev.length}`, '次', footText(false), '', '')
  ].join('');

  document.getElementById('tb-end').textContent='至 '+S.dm;

  document.getElementById('sub').textContent = on
    ? '当前：两融在创 250 日新低，平均股价已不再新低 —— 信号成立'
    : '两融创新低、平均股价不新低 —— 唯一在数据里站得住的规则';
}

function events(){
  const {asc,ev,minP}=S;
  document.getElementById('tbody').innerHTML=ev.map(i=>{
    const off=asc[i][2]/minP[i]-1;
    return `<tr><td>${asc[i][0]}</td>
     <td class="r num">${fmt(asc[i][1],0)}</td>
     <td class="r num">${fmt(asc[i][2],2)}</td>
     <td class="r num ${off>=0?'text-up':'text-down'}">${off>=0?'+':''}${(off*100).toFixed(1)}%</td></tr>`;
  }).join('');
}

function visible(){
  if(!years) return S.asc;
  const start=new Date(S.asc[S.last][0]);
  start.setFullYear(start.getFullYear()-years);
  return S.asc.filter(r=>new Date(r[0])>=start);
}

function draw(){
  const T=getChartTheme();
  const {ev}=S;
  const rows=visible();
  const dates=rows.map(r=>r[0]), b=rows.map(r=>r[1]), p=rows.map(r=>r[2]);
  const shown=new Set(dates);
  const pts=[];
  for(const i of ev){
    if(shown.has(S.asc[i][0])) pts.push({coord:[S.asc[i][0],S.asc[i][1]]});
  }

  const text={color:T.text,fontFamily:'-apple-system,"PingFang SC","Microsoft YaHei",sans-serif',fontSize:12};

  chart.setOption({
    backgroundColor:'transparent',
    animation:false,
    grid:{left:8,right:8,top:44,bottom:26,containLabel:true},
    legend:{data:['两融余额（左轴·万亿）','平均股价（右轴·元）'],top:2,left:0,
      itemWidth:16,itemHeight:8,itemGap:18,textStyle:{...text,color:T.text,fontSize:12}},
    tooltip:buildAxisTooltip(T, q=>{
      const i=dates.indexOf(q[0].axisValue);
      return `<div style="font-weight:600;margin-bottom:4px">${q[0].axisValue}</div>
        两融 ${fmt(b[i],0)} 亿<br>平均股价 ${fmt(p[i],2)} 元`;
    }),
    xAxis:{type:'category',data:dates,boundaryGap:false,
      axisLine:{lineStyle:{color:T.axis}},axisTick:{show:false},
      axisLabel:{...text,color:T.text,hideOverlap:true}},
    yAxis:[
      {type:'value',position:'left',scale:true,
       axisLine:{show:false},axisTick:{show:false},
       splitLine:{lineStyle:{color:T.grid}},
       axisLabel:{...text,color:T.text,formatter:v=>v/10000+' 万亿'}},
      {type:'value',position:'right',scale:true,
       axisLine:{show:false},axisTick:{show:false},splitLine:{show:false},
       axisLabel:{...text,color:T.text}}
    ],
    series:[
      {name:'两融余额（左轴·万亿）',type:'line',data:b,showSymbol:false,yAxisIndex:0,
       lineStyle:{color:T.lineBlue,width:1.4},
       areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,
         colorStops:[{offset:0,color:T.zoomFill},{offset:1,color:'transparent'}]}},
       markPoint:{silent:true,symbol:'circle',symbolSize:7,label:{show:false},
         itemStyle:{color:T.lineRed,opacity:.92},data:pts}},
      {name:'平均股价（右轴·元）',type:'line',data:p,showSymbol:false,yAxisIndex:1,
       lineStyle:{color:T.lineYellow,width:1.4}}
    ]
  },true);
}

function render(){
  const ok=build();
  document.getElementById('app').style.display=ok?'':'none';
  document.getElementById('empty').style.display=ok?'none':'';
  if(!ok) return;
  kpis();events();
  document.getElementById('foot-note').textContent=footText(true);
  if(window.echarts){
    if(!chart){
      chart=echarts.init(document.getElementById('chart'));
      window.addEventListener('resize',()=>chart&&chart.resize());
    }
    draw();
  }
}

document.getElementById('range').addEventListener('click',e=>{
  const btn=e.target.closest('button'); if(!btn) return;
  years=Number(btn.dataset.y);
  [...e.currentTarget.children].forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));
  if(chart) draw();
});

/* common.js 切换主题后会派发 themeChanged，图表与表格配色跟着换 */
window.addEventListener('themeChanged',()=>{
  if(!chart) return;
  draw();
  events();
  kpis();
});

render();
</script>
</body>
</html>
